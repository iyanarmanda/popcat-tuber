name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK4 & ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libasound2-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive & checksum
        run: |
          mkdir -p dist
          cp target/release/popcat-tuber dist/
          cd dist
          tar -czvf popcat-tuber-linux-x86_64.tar.gz popcat-tuber
          sha256sum popcat-tuber-linux-x86_64.tar.gz > popcat-tuber-linux-x86_64.tar.gz.sha256

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/popcat-tuber-linux-x86_64.tar.gz
            dist/popcat-tuber-linux-x86_64.tar.gz.sha256

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 & GTK4 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-gtk4
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld

      - name: Setup Rust toolchain (UCRT/LLVM target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnullvm

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        shell: msys2 {0}
        run: cargo build --release --locked --target x86_64-pc-windows-gnullvm

      - name: Bundle executable & GTK4 runtime DLLs
        shell: msys2 {0}
        run: |
          PKG_DIR="dist/popcat-tuber-windows-x86_64"
          mkdir -p "$PKG_DIR/share/glib-2.0/schemas"
          mkdir -p "$PKG_DIR/lib"

          cp target/x86_64-pc-windows-gnullvm/release/popcat-tuber.exe "$PKG_DIR/"
          ldd target/x86_64-pc-windows-gnullvm/release/popcat-tuber.exe | grep '/clang64/bin' | awk '{print $3}' | xargs -I {} cp {} "$PKG_DIR/"
          cp /clang64/bin/gspawn-win64-helper*.exe "$PKG_DIR/" || true
          cp /clang64/share/glib-2.0/schemas/gschemas.compiled "$PKG_DIR/share/glib-2.0/schemas/"
          cp -r /clang64/lib/gdk-pixbuf-2.0 "$PKG_DIR/lib/"

      - name: Create ZIP archive & checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/popcat-tuber-windows-x86_64/* -DestinationPath dist/popcat-tuber-windows-x86_64.zip
          (Get-FileHash dist/popcat-tuber-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower() + "  popcat-tuber-windows-x86_64.zip" | Out-File -Encoding ascii dist/popcat-tuber-windows-x86_64.zip.sha256

      - name: Upload Windows release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/popcat-tuber-windows-x86_64.zip
            dist/popcat-tuber-windows-x86_64.zip.sha256
